[project]
name = "openswells-research"
version = "0.1.0"
description = "Data tooling and experiments toward an OpenSwells wave forecast model"
readme = "README.md"
authors = [
    { name = "Evan Coons", email = "evancoons22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cfgrib>=0.9.15.1",
    "dask>=2026.8.0",
    "eccodes>=2.50.0",
    "eccodeslib>=2.50.0.33",
    "fsspec>=2026.9.0",
    "gcsfs>=2026.10.1",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "s3fs>=2026.9.0",
    "scipy>=1.18.1",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[project.scripts]
openswells-research = "openswells_research:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
