{{ define "forecast" }}
<div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Every chart color comes from the theme's custom properties, so
            // the SVG series, the legend chips, and the server-rendered
            // markup can never disagree about what "good" or "wind" looks like.
            const themeColor = (name, fallback) =>
                getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;

            const CHART = {
                linePrimary: themeColor('--swell-trend', '#4f6fae'),
                lineSecondary: themeColor('--swell-2', '#e2b86b'),
                lineTertiary: themeColor('--swell-3', '#6fcf97'),
                lineQuaternary: themeColor('--swell-4', '#73c4b6'),
                lineWindSea: themeColor('--wind-sea', '#b98ad6'),
                surf: themeColor('--surf', '#3b82f6'),
                wind: themeColor('--wind', '#eec37c'),
                tide: themeColor('--tide', '#2ec2c2'),
                axis: themeColor('--text-3', '#8b9099'),
                grid: themeColor('--line', '#2f3137'),
                gridStrong: themeColor('--line-strong', '#43454c'),
                verticalLine: themeColor('--accent-bright', '#3b82f6'),
                label: themeColor('--text-3', '#8b9099'),
                title: themeColor('--text-1', '#d5d7dc'),
            };
            const getChartColors = () => CHART;

            // 16-point compass rose; forecast directions read as cardinals
            const CARDINALS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
            const cardinal = d => CARDINALS[Math.round((((d % 360) + 360) % 360) / 22.5) % 16];
            // Marine directions describe where swell/wind comes FROM. The
            // arrows show where it travels, matching the current report.
            const travelBearing = fromDegrees => (Number(fromDegrees) + 180) % 360;

            const headerDateFmt = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });
            const resolvedTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local time';
            const zoneName = new Intl.DateTimeFormat(undefined, { timeZoneName: 'short' })
                .formatToParts(new Date()).find(part => part.type === 'timeZoneName')?.value || resolvedTimeZone;

            function localDateKey(date) {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            }

            function localDayBounds(key) {
                const parts = key.split('-').map(Number);
                const start = new Date(parts[0], parts[1] - 1, parts[2]);
                const end = new Date(parts[0], parts[1] - 1, parts[2] + 1);
                return { start, end };
            }

            const localHour = date => date.getHours() + date.getMinutes() / 60;

            const timezoneLabel = document.getElementById('forecastTimezone');
            if (timezoneLabel) {
                timezoneLabel.textContent = zoneName;
                timezoneLabel.title = resolvedTimeZone;
            }

            // weekday of the selected day, for the hover readout
            const weekdayFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
            const currentDayName = () => {
                if (!currentDate) return '';
                const [yy, mm, dd] = currentDate.split('-').map(Number);
                return weekdayFmt.format(new Date(yy, mm - 1, dd));
            };

            function displayClicked(date) {
                const dayData = dataGroupedByDay[date];
                if (!dayData) return;
                currentDay = dayData;
                currentDate = date;

                const dateHeader = document.getElementById('date-header');
                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

                const parts = date.split('-');
                const tempdate = new Date(parts[0], parts[1] - 1, parts[2]);

                dateHeader.innerHTML = `${days[tempdate.getDay()]} <span class="hdr-date">${headerDateFmt.format(tempdate)}</span>`;
                updateStripSelection(date);
            }

            // --- Surface wind ---------------------------------------------
            // 3-hourly wind at the station's nearest wave-model grid point,
            // served by /api/wind. Rendered as a lane inside the hourly chart
            // so it shares the swell chart's x axis. The lane space is
            // reserved with a loading pulse until the fetch settles, and
            // collapses only if the run has no wind files.
            const WIND_STATION = "{{.SwellReport.StationId}}";
            let windSamples = []; // [{t: Date, s: m/s, d: from-degrees}]
            let windState = 'loading'; // 'loading' | 'ready' | 'none'

            // wind at an arbitrary moment, interpolated between the
            // 3-hourly samples (null outside the sampled range)
            function windAtTime(tMs) {
                if (windSamples.length < 2) return null;
                if (tMs < windSamples[0].t.getTime() || tMs > windSamples[windSamples.length - 1].t.getTime()) return null;
                const i = windSamples.findIndex(w => w.t.getTime() >= tMs);
                if (i <= 0) return { s: windSamples[0].s, d: windSamples[0].d };
                const a = windSamples[i - 1], b = windSamples[i];
                const f = (tMs - a.t.getTime()) / (b.t.getTime() - a.t.getTime());
                const diff = ((b.d - a.d + 540) % 360) - 180;
                return { s: a.s + (b.s - a.s) * f, d: (a.d + diff * f + 360) % 360 };
            }

            async function loadWindForecast() {
                try {
                    const response = await fetch('/api/wind/' + encodeURIComponent(WIND_STATION));
                    if (!response.ok) return;
                    const payload = await response.json();
                    if (!payload.samples || !payload.samples.length) return;
                    let base = null;
                    if (payload.start) {
                        const [dPart, tPart] = payload.start.split('_');
                        base = new Date(Date.UTC(+dPart.slice(0, 4), +dPart.slice(4, 6) - 1, +dPart.slice(6, 8), +tPart.slice(0, 2)));
                    } else if (data.length) {
                        base = new Date(data[0].dateObj); // fall back to the bulletin run
                    }
                    if (!base || isNaN(base.getTime())) return;
                    windSamples = payload.samples.map(s => ({
                        t: new Date(base.getTime() + s.h * 3600e3),
                        s: s.s,
                        d: s.d,
                    }));
                    windState = 'ready';
                } catch (error) {
                    console.warn('Wind forecast unavailable:', error);
                } finally {
                    if (windState !== 'ready') windState = 'none';
                    // redraw the strip so the wind lane's loading placeholder
                    // becomes the data (or collapses if none is available)
                    buildSwellStrip();
                    if (stripSelectedDate) updateStripSelection(stripSelectedDate);
                    if (currentDay.length) updateChart(currentDay, svg);
                }
            }
            loadWindForecast();

            // --- Tide ------------------------------------------------------
            // Predicted highs and lows at the nearest NOAA CO-OPS station,
            // injected by the spot page (buoy pages have none). Most coastal
            // stations are subordinate stations that NOAA only predicts as
            // highs and lows; between those the curve is a half cosine, the
            // same shape NOAA draws for them. Reference stations also send
            // hourly predictions, which the curve follows instead.
            const TIDE = window.SPOT_TIDES || null;
            const tideEvents = TIDE && TIDE.events
                ? TIDE.events.map(e => ({ t: e.t, ft: e.v * 3.28084, high: e.high }))
                : [];
            const tideHourly = TIDE && TIDE.hourly
                ? TIDE.hourly.v.map((v, i) => ({ t: TIDE.hourly.start + i * 3600e3, ft: v * 3.28084 }))
                : [];
            // one y range for every day, so day-to-day tides compare at a glance
            const tideExtent = tideEvents.length > 1
                ? d3.extent([...tideEvents, ...tideHourly], e => e.ft)
                : null;

            // tide height (ft) and direction at an arbitrary moment (null
            // outside the predicted range)
            function tideAtTime(tMs) {
                const pts = tideHourly.length > 1 ? tideHourly : tideEvents;
                if (pts.length < 2) return null;
                if (tMs < pts[0].t || tMs > pts[pts.length - 1].t) return null;
                const i = Math.max(1, pts.findIndex(e => e.t >= tMs));
                const a = pts[i - 1], b = pts[i];
                const f = (tMs - a.t) / (b.t - a.t);
                // hourly values are close enough together to blend linearly
                const shape = pts === tideHourly ? f : (1 - Math.cos(Math.PI * f)) / 2;
                return { ft: a.ft + (b.ft - a.ft) * shape, rising: b.ft > a.ft };
            }

            function convertToDate(data, date) {
                if (!data.length) return data;
                const runHour = parseInt(data[0].Date.split(' ')[1], 10) || 0;
                const fallbackStart = new Date(Date.UTC(
                    +date.slice(0, 4), +date.slice(4, 6) - 1, +date.slice(6, 8), runHour));
                for (let i = 0; i < data.length; i++) {
                    const explicit = new Date(data[i].Time);
                    data[i].dateObj = Number.isNaN(explicit.getTime())
                        ? new Date(fallbackStart.getTime() + i * 3600e3)
                        : explicit;
                    data[i].hour = localHour(data[i].dateObj);
                }
                return data;
            }

            function groupDataByDay(data) {
                data.sort((a, b) => a.dateObj - b.dateObj);
                const groupedData = {};
                data.forEach(item => {
                    const dateKey = localDateKey(item.dateObj);
                    if (!groupedData[dateKey]) {
                        groupedData[dateKey] = [];
                    }
                    groupedData[dateKey].push(item);
                });
                return groupedData;
            }

            let currentDay = [];
            let currentDate = null;
            let data = convertToDate({{json .ForecastData.Forecast}}, "{{.ForecastData.Date}}");
            const localToday = new Date();
            localToday.setHours(0, 0, 0, 0);
            data = data.filter(item => item.dateObj >= localToday);
            let dataGroupedByDay = groupDataByDay(data);

            // --- Day cards -------------------------------------------------
            // Built client-side from the same local-day grouping the strip
            // uses, so the day columns line up by construction. (The server
            // buckets days in UTC, which drifted half a day for non-UTC
            // users and caused the strip/card misalignment.)
            const dayKeys = Object.keys(dataGroupedByDay).sort().slice(0, 16);
            const includedDays = new Set(dayKeys);
            data = data.filter(item => includedDays.has(localDateKey(item.dateObj)));
            dataGroupedByDay = groupDataByDay(data);
            const dayStats = {}; // key -> {avgFt, cond, label}, feeds the current-conditions card
            const CONDITION_COLORS = {
                epic: themeColor('--cond-epic', '#86d4c6'),
                good: themeColor('--cond-good', '#4fd1bc'),
                fair: themeColor('--cond-fair', '#eec478'),
                poor: themeColor('--cond-poor', '#ef7a83'),
            };

            // Hover readout shared by the 16-day strip and the day detail.
            // It answers "what's it like then?": a headline of the surf
            // range and its rating (the swell height on buoy pages, which
            // have no surf model), over a short subheader of the main swell,
            // wind, and tide. Per-train swell detail stays on the chart.
            function readoutHTML({ when, surf, rating, swell, wind, tide }) {
                const headline = surf || (swell ? `${swell.ft.toFixed(1)} ft` : '--');
                const badge = rating
                    ? `<span class="readout-rating" style="--rating-color: ${CONDITION_COLORS[rating]}">${rating.toUpperCase()}</span>`
                    : '';
                const sub = [];
                if (swell && surf) sub.push(['Swell', `${swell.ft.toFixed(1)} ft · ${swell.per}s ${cardinal(swell.deg)}`]);
                else if (swell) sub.push(['Swell', `${swell.per}s ${cardinal(swell.deg)}`]);
                if (wind) sub.push(['Wind', `${wind.mph} mph ${cardinal(wind.deg)}`]);
                if (tide) sub.push(['Tide', `${tide.ft.toFixed(1)} ft ${tide.rising ? 'rising' : 'falling'}`]);
                return `<div class="readout-time">${when}</div>`
                    + `<div class="readout-head"><span class="readout-surf">${headline}</span>${badge}</div>`
                    + (sub.length ? `<div class="readout-sub">${sub.map(([k, v]) => `<span class="k">${k}</span><span class="v">${v}</span>`).join('')}</div>` : '');
            }
            // the main (largest) swell train in a forecast row
            const mainSwell = row => {
                const ft = parseFloat(row.PrimaryWaveHeight) * 3.28084;
                if (!Number.isFinite(ft) || ft <= 0) return null;
                return { ft, per: Math.round(parseFloat(row.PrimaryPeriod)), deg: row.PrimaryDegrees };
            };

            // Hourly surf-condition classifier output, injected by the spot
            // page (buoy pages have none). Rendered as a lane in the 16-day
            // strip and in the hourly detail chart, on their shared x scales.
            const CONDS = (window.SPOT_CONDITIONS || []).map(c => ({ ...c, t: new Date(c.t) }));
            // Spot pages carry a breaking surf range per hour; the outlook
            // then charts surf height rather than the primary swell.
            const SURF_MODE = CONDS.length > 0 && typeof CONDS[0].surf === 'string';

            // a day rates as its best hour. Ratings come only from the
            // classifier, so buoy pages (no surf spot) show none.
            const condDayBest = {}; // local date key -> best HourlyCondition
            for (const c of CONDS) {
                const key = dateKeyOf(c.t);
                if (!condDayBest[key] || c.score > condDayBest[key].score) condDayBest[key] = c;
            }
            if (CONDS.length) {
                const title = document.querySelector('.strip-title');
                if (title) title.innerHTML = `${SURF_MODE ? 'Surf' : 'Swell'} · wind · conditions · 16 day outlook · <span title="${resolvedTimeZone}">${zoneName}</span>`;
            }

            const cardDayFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short' });

            function buildDayCards() {
                const container = document.getElementById('forecastContainer');
                if (!container) return;
                container.innerHTML = '';
                for (const key of dayKeys) {
                    const heights = dataGroupedByDay[key]
                        .map(r => parseFloat(r.PrimaryWaveHeight))
                        .filter(Number.isFinite);
                    const avgFt = heights.length
                        ? (heights.reduce((a, b) => a + b, 0) / heights.length) * 3.28084
                        : 0;
                    // with surf ranges, a day shows its best hour's surf
                    const best = condDayBest[key];
                    const cond = best ? best.rating : null;
                    const label = SURF_MODE && best ? best.surf : `${avgFt.toFixed(1)}ft`;
                    dayStats[key] = { avgFt, cond, label, surf: SURF_MODE && !!best };
                    const parts = key.split('-');
                    const d = new Date(parts[0], parts[1] - 1, parts[2]);
                    const card = document.createElement('div');
                    card.className = 'forecastcard text-white';
                    card.setAttribute('data-date', key);
                    card.innerHTML =
                        `<div class="fc-day">${cardDayFmt.format(d)} ${d.getMonth() + 1}/${d.getDate()}</div>` +
                        `<div class="fc-height">${label}</div>` +
                        // buoys have no rating; an empty row keeps the card
                        // the same height as a surf spot's
                        (cond
                            ? `<div class="fc-cond" style="color: ${CONDITION_COLORS[cond]};">${cond}</div>`
                            : '<div class="fc-cond" aria-hidden="true">&nbsp;</div>');
                    container.appendChild(card);
                }
                const current = dayStats[dayKeys[0]];
                document.querySelectorAll('[data-current-condition-card]').forEach(card => {
                    if (!current || !current.cond) return;
                    card.style.setProperty('--condition-color', CONDITION_COLORS[current.cond]);
                    const condition = card.querySelector('[data-current-condition]');
                    const height = card.querySelector('[data-current-height]');
                    if (condition) condition.textContent = current.cond;
                    if (height) height.textContent = current.label;
                });
            }
            buildDayCards();

            // --- 16-day strip: swell height + wind speed lanes ------------
            // Two lanes on one shared day grid: swell (green-blue, ft) on top,
            // wind (amber, mph) beneath. Hover reads out both; clicking
            // jumps to that day's hourly detail.
            const stripHost = document.getElementById('swellStrip');
            const stripReadout = document.getElementById('stripReadout');
            const stripPanel = stripHost.closest('.swell-strip');
            const stripHoverLine = document.getElementById('stripHoverLine');
            const stripTooltip = document.getElementById('stripTooltip');
            // Swell lane: the surf range's top (labeled with the range) on
            // spot pages, the primary swell elsewhere.
            const stripPts = SURF_MODE
                ? CONDS
                    .filter(c => c.t >= localToday && includedDays.has(localDateKey(c.t)))
                    .map(c => ({ t: c.t, ft: c.ft_hi, label: c.surf }))
                : data.map(d => {
                    const ft = (parseFloat(d.PrimaryWaveHeight) || 0) * 3.28084;
                    return { t: d.dateObj, ft, label: `${ft.toFixed(1)} ft` };
                });
            let stripSel = null;
            let stripX = null;
            let stripSelectedDate = null;

            function dateKeyOf(t) {
                return localDateKey(t);
            }

            const stripTimeFmt = d3.timeFormat('%a %-d, %-I %p');
            const stripDayFmt = d3.timeFormat('%a %-d');

            function stripMono(sel, size, color) {
                return sel.attr('fill', color).attr('font-size', size)
                    .attr('font-family', "'JetBrains Mono', monospace");
            }

            function buildSwellStrip() {
                if (!stripHost || stripPts.length < 2 || !dayKeys.length) return;
                stripHost.innerHTML = '';
                stripHoverLine.style.display = 'none';
                stripTooltip.style.display = 'none';
                const width = stripHost.clientWidth;
                if (width < 60) return;

                // Domain comes from the card day list itself, so both views
                // share one day grid.
                const p0 = dayKeys[0].split('-');
                const pN = dayKeys[dayKeys.length - 1].split('-');
                const domainStart = new Date(p0[0], p0[1] - 1, p0[2]);
                const domainEnd = new Date(pN[0], pN[1] - 1, +pN[2] + 1);
                const x = d3.scaleTime().domain([domainStart, domainEnd]).range([0, width]);
                stripX = x;

                const windPts = windSamples.filter(w => w.t >= domainStart && w.t <= domainEnd);
                const hasWind = windPts.length > 1;
                // reserve the wind lane while /api/wind is in flight so the
                // strip doesn't change height when the data lands
                const showWindLane = hasWind || windState === 'loading';

                // lane geometry: swell on top, wind beneath, labels at bottom
                const swTop = 14, swBase = 78;
                const wdTop = swBase + 16, wdBase = wdTop + 40;
                // conditions lane at the bottom, on the same day grid
                const condPts = CONDS.filter(c => c.t >= domainStart && c.t < domainEnd);
                const showCondLane = condPts.length > 1;
                const cdTop = (showWindLane ? wdBase : swBase) + 16, cdBase = cdTop + 28;
                const gridBase = showCondLane ? cdBase : (showWindLane ? wdBase : swBase);
                const height = gridBase + 16;

                const maxFt = d3.max(stripPts, p => p.ft) || 1;
                const y = d3.scaleLinear().domain([0, maxFt * 1.2]).range([swBase, swTop]);

                const svg = d3.select(stripHost).append('svg')
                    .attr('width', width).attr('height', height);

                const grad = svg.append('defs').append('linearGradient')
                    .attr('id', 'stripFill').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 1);
                grad.append('stop').attr('offset', '0%').attr('stop-color', CHART.linePrimary).attr('stop-opacity', 0.45);
                grad.append('stop').attr('offset', '100%').attr('stop-color', CHART.linePrimary).attr('stop-opacity', 0.02);

                // selected-day band spans both lanes
                stripSel = svg.append('rect')
                    .attr('y', swTop - 6).attr('height', gridBase - swTop + 6)
                    .attr('fill', 'rgba(29, 78, 216, 0.24)').attr('display', 'none');

                // day grid: hairlines through both lanes, labels at the bottom
                const labelStep = width < 520 ? 4 : 2;
                const days = d3.timeDay.range(d3.timeDay.offset(d3.timeDay.floor(domainStart), 1), domainEnd);
                days.forEach((day, i) => {
                    svg.append('line')
                        .attr('x1', x(day)).attr('x2', x(day))
                        .attr('y1', swTop - 6).attr('y2', gridBase + 4)
                        .attr('stroke', 'rgba(255, 255, 255, 0.05)');
                    if (i % labelStep === 1) {
                        stripMono(svg.append('text'), 9, CHART.label)
                            .attr('x', Math.max(18, Math.min(width - 18, x(day))))
                            .attr('y', height - 4)
                            .attr('text-anchor', 'middle')
                            .text(stripDayFmt(day));
                    }
                });
                const baselines = [swBase];
                if (showWindLane) baselines.push(wdBase);
                if (showCondLane) baselines.push(cdBase);
                for (const baseline of baselines) {
                    svg.append('line')
                        .attr('x1', 0).attr('x2', width)
                        .attr('y1', baseline).attr('y2', baseline)
                        .attr('stroke', CHART.gridStrong);
                }

                // swell lane
                if (SURF_MODE) {
                    stripMono(svg.append('text'), 9, CHART.label)
                        .attr('x', 2).attr('y', swTop - 5)
                        .text('SURF (FT)');
                }
                svg.append('path').datum(stripPts)
                    .attr('fill', 'url(#stripFill)')
                    .attr('d', d3.area().x(p => x(p.t)).y0(swBase).y1(p => y(p.ft)).curve(d3.curveMonotoneX));
                svg.append('path').datum(stripPts)
                    .attr('fill', 'none').attr('stroke', CHART.linePrimary).attr('stroke-width', 1.5)
                    .attr('d', d3.line().x(p => x(p.t)).y(p => y(p.ft)).curve(d3.curveMonotoneX));

                const peak = stripPts.reduce((a, b) => (b.ft > a.ft ? b : a));
                svg.append('circle')
                    .attr('cx', x(peak.t)).attr('cy', y(peak.ft)).attr('r', 2.5)
                    .attr('fill', '#fff');
                stripMono(svg.append('text'), 10, '#e6e6e6')
                    .attr('x', Math.max(24, Math.min(width - 24, x(peak.t))))
                    .attr('y', Math.max(y(peak.ft) - 6, 10))
                    .attr('text-anchor', 'middle')
                    .text(SURF_MODE ? peak.label : `${peak.ft.toFixed(1)} ft`);

                // wind lane
                let yw = null;
                if (showWindLane) {
                    stripMono(svg.append('text'), 9, CHART.label)
                        .attr('x', 2).attr('y', wdTop - 5)
                        .text('WIND (MPH)');
                }
                if (showWindLane && !hasWind) {
                    // still loading: pulsing placeholder in the lane
                    const wdMid = (wdTop + wdBase) / 2;
                    svg.append('line').attr('class', 'wind-loading')
                        .attr('x1', 0).attr('x2', width)
                        .attr('y1', wdMid).attr('y2', wdMid)
                        .attr('stroke', CHART.wind).attr('stroke-width', 1.5)
                        .attr('stroke-dasharray', '4,5');
                    stripMono(svg.append('text').attr('class', 'wind-loading'), 9, CHART.wind)
                        .attr('x', width / 2).attr('y', wdMid - 8)
                        .attr('text-anchor', 'middle')
                        .text('loading wind…');
                }
                if (hasWind) {
                    const maxMph = d3.max(windPts, w => w.s) * 2.237;
                    yw = d3.scaleLinear().domain([0, Math.max(maxMph * 1.25, 5)]).range([wdBase, wdTop]);
                    svg.append('path').datum(windPts)
                        .attr('fill', 'none').attr('stroke', CHART.wind).attr('stroke-width', 1.5)
                        .attr('d', d3.line().x(w => x(w.t)).y(w => yw(w.s * 2.237)).curve(d3.curveMonotoneX));
                    const windPeak = windPts.reduce((a, b) => (b.s > a.s ? b : a));
                    svg.append('circle')
                        .attr('cx', x(windPeak.t)).attr('cy', yw(windPeak.s * 2.237)).attr('r', 2)
                        .attr('fill', CHART.wind);
                    stripMono(svg.append('text'), 9, CHART.wind)
                        .attr('x', Math.max(28, Math.min(width - 28, x(windPeak.t))))
                        .attr('y', Math.max(yw(windPeak.s * 2.237) - 5, wdTop + 8))
                        .attr('text-anchor', 'middle')
                        .text(`${(windPeak.s * 2.237).toFixed(0)} mph`);
                }

                // conditions lane: one bar per hour, height = score,
                // color = rating, on the same time scale as the lanes above
                if (showCondLane) {
                    stripMono(svg.append('text'), 9, CHART.label)
                        .attr('x', 2).attr('y', cdTop - 5)
                        .text('CONDITIONS');
                    const hourW = x(new Date(domainStart.getTime() + 3600e3)) - x(domainStart);
                    const bw = Math.max(1.25, hourW - 1);
                    const yc = d3.scaleLinear().domain([0, 100]).range([cdBase, cdTop]);
                    svg.append('g').selectAll('rect').data(condPts).join('rect')
                        .attr('x', c => x(c.t) - bw / 2)
                        .attr('width', bw)
                        .attr('y', c => yc(Math.max(c.score, 6)))
                        .attr('height', c => cdBase - yc(Math.max(c.score, 6)))
                        .attr('fill', c => CONDITION_COLORS[c.rating]);
                }

                const bisect = d3.bisector(p => p.t).center;
                const windBisect = d3.bisector(w => w.t).center;
                const condBisect = d3.bisector(c => c.t).center;
                const dataBisect = d3.bisector(d => d.dateObj).center;
                svg.append('rect')
                    .attr('width', width).attr('height', height)
                    .attr('fill', 'none').attr('pointer-events', 'all')
                    .style('cursor', 'pointer')
                    .on('mousemove', (event) => {
                        const [mx] = d3.pointer(event);
                        const t = x.invert(mx);
                        const p = stripPts[bisect(stripPts, t)];
                        const panelRect = stripPanel.getBoundingClientRect();
                        const hostRect = stripHost.getBoundingClientRect();
                        const panelX = hostRect.left - panelRect.left + x(p.t);
                        stripHoverLine.style.left = `${panelX}px`;
                        stripHoverLine.style.display = 'block';

                        const c = showCondLane ? condPts[condBisect(condPts, t)] : null;
                        const row = data.length ? data[dataBisect(data, t)] : null;
                        const w = hasWind ? windPts[windBisect(windPts, t)] : null;
                        stripTooltip.innerHTML = readoutHTML({
                            when: stripTimeFmt(p.t),
                            surf: SURF_MODE ? p.label : null,
                            rating: c ? c.rating : null,
                            swell: row ? mainSwell(row) : null,
                            wind: w ? { mph: (w.s * 2.237).toFixed(0), deg: w.d } : null,
                            tide: tideAtTime(p.t.getTime()),
                        });
                        let text = `${stripTimeFmt(p.t)} · ${p.label}`;
                        if (w) text += ` · ${(w.s * 2.237).toFixed(0)} mph`;
                        if (c) text += ` · ${c.rating}`;
                        stripTooltip.style.display = 'block';
                        const tooltipWidth = stripTooltip.offsetWidth;
                        const tooltipHeight = stripTooltip.offsetHeight;
                        const placeLeft = panelX + 10 + tooltipWidth > stripPanel.clientWidth;
                        stripTooltip.style.left = `${placeLeft ? panelX - tooltipWidth - 10 : panelX + 10}px`;
                        stripTooltip.style.top = `${Math.max(6, Math.min(stripPanel.clientHeight - tooltipHeight - 6, event.clientY - panelRect.top - tooltipHeight / 2))}px`;
                        stripReadout.textContent = text;
                        stripReadout.style.color = '#bfdbfe';
                    })
                    .on('mouseleave', () => {
                        stripHoverLine.style.display = 'none';
                        stripTooltip.style.display = 'none';
                        stripReadout.textContent = 'Select a day for hourly detail';
                        stripReadout.style.color = '';
                    })
                    .on('click', (event) => {
                        const [mx] = d3.pointer(event);
                        const p = stripPts[bisect(stripPts, x.invert(mx))];
                        const card = document.querySelector(`.forecastcard[data-date="${dateKeyOf(p.t)}"]`);
                        if (card) card.click();
                    });
            }

            function updateStripSelection(date) {
                stripSelectedDate = date;
                if (!stripSel || !stripX) return;
                const { start, end } = localDayBounds(date);
                const x0 = Math.max(0, stripX(start));
                const x1 = Math.min(stripX.range()[1], stripX(end));
                stripSel.attr('x', x0).attr('width', Math.max(0, x1 - x0)).attr('display', null);
            }
            buildSwellStrip();

            const cards = document.querySelectorAll('.forecastcard');
            const firstCard = cards[0];

            // The hourly detail is three stacked panels -- swell height,
            // wind, surf conditions -- in one svg so they share the x scale
            // and crosshair. Each panel has its own title row, axis, and
            // frame; `height` is the swell panel's plot height.
            // The right margin mirrors the left (axis-label) margin so the
            // plots sit centered in the card; phones keep a slim right edge
            // rather than give up plot width.
            const chartOuterWidth = document.getElementById('chart-container').clientWidth;
            const margin = {top: 24, right: chartOuterWidth >= 640 ? 44 : 14, bottom: 24, left: 44},
                width = chartOuterWidth - margin.left - margin.right,
                height = 180;

            // vertical space between panels; holds the next panel's title
            const panelGap = 36, windLaneH = 100, tideLaneH = 110, condLaneH = 68;
            // hour labels: 12am, 3am, ... 9pm
            const fmtHour = h => {
                const hh = Math.round(h) % 24;
                return `${hh % 12 || 12}${hh < 12 ? 'am' : 'pm'}`;
            };
            // Direction glyph: a notched arrowhead pointing up at 0deg, so
            // rotate(bearing) points it the way the swell or wind travels.
            // The notched tail makes front and back unmistakable, which a
            // plain triangle is not. `s` is the half-length in px; the
            // glyph is centered on the data point.
            const arrowPath = s => `M0 ${-s} L${0.72 * s} ${0.8 * s} L0 ${0.36 * s} L${-0.72 * s} ${0.8 * s} Z`;
            // condition rating bands on the classifier's 0-100 score
            // (ratingFor in server/conditions.go)
            const COND_BANDS = [['poor', 0, 28], ['fair', 28, 55], ['good', 55, 80], ['epic', 80, 100]];

            const svg = d3.select("#chart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
                .attr("preserveAspectRatio", "none")
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const x = d3.scaleLinear()
                .domain([0, 23])
                .range([ 0, width ]);
            const xAxisGroup = svg.append("g")
                .attr("class", "xaxis")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x).tickValues([0, 3, 6, 9, 12, 15, 18, 21]).tickFormat(fmtHour).tickSize(4).tickSizeOuter(0).tickPadding(6));

            var y = d3.scaleLinear()
                .range([ height, 0 ]);

            var yScale = d3.scaleLinear()
                .range([ height, 0 ]);

            // full-width gridlines at each tick; the unit is in the title
            var yAxis = d3.axisLeft(yScale).ticks(4)
                .tickFormat(d => (d % 1 ? d.toFixed(1) : d.toFixed(0)))
                .tickSize(-width).tickSizeOuter(0).tickPadding(8);

            const yAxisGroup = svg.append("g")
                .attr("class", "yaxis")
                .call(yAxis);

            const setAxisColor = () => {
                const colors = getChartColors();
                svg.selectAll(".yaxis, .xaxis").selectAll("text").style("fill", colors.axis);
                svg.selectAll(".xaxis").selectAll("path, line").style("stroke", CHART.gridStrong);
                svg.selectAll(".yaxis").selectAll("path").style("stroke", 'none');
                svg.selectAll(".yaxis").selectAll("line").style("stroke", CHART.grid);
            };
            setAxisColor();

            function updateChart(data, svg) {
                if (!data || data.length === 0) return;
                
                let chartColors = getChartColors();
                svg.selectAll(".vertical-line").remove();
                svg.selectAll(".overlay").remove();
                svg.selectAll(".wind-lane").remove();
                svg.selectAll(".tide-lane").remove();
                svg.selectAll(".cond-lane").remove();

                // wind samples for the selected day, as fractional hours so
                // they share the swell chart's x scale
                let windDayPts = [];
                if (windState === 'ready' && currentDate) {
                    const { start: windDayStart, end: windDayEnd } = localDayBounds(currentDate);
                    windDayPts = windSamples
                        .filter(w => w.t >= windDayStart && w.t < windDayEnd)
                        .map(w => ({ hour: localHour(w.t), s: w.s, d: w.d }))
                        .filter(w => w.hour <= 23);
                    // the run's 3-hourly samples rarely land on local
                    // midnight; pad the day's ends with interpolated points
                    // so the wind lane spans the day like the swell lanes do
                    if (windDayPts.length) {
                        for (const hour of [0, 23]) {
                            if (!windDayPts.some(w => w.hour === hour)) {
                                const sampleTime = new Date(windDayStart);
                                sampleTime.setHours(hour, 0, 0, 0);
                                const w = windAtTime(sampleTime.getTime());
                                if (w) windDayPts.push({ hour, s: w.s, d: w.d, pad: true });
                            }
                        }
                        windDayPts.sort((a, b) => a.hour - b.hour);
                    }
                    if (windDayPts.length < 2) windDayPts = [];
                }

                // the wind lane keeps its slot while loading so the chart
                // doesn't jump when the data lands
                const showWind = windState !== 'none';
                const windTop = height + panelGap;
                const windBottom = showWind ? windTop + windLaneH : height;

                // classifier hours for the selected day, as fractional hours
                // on the swell chart's x scale
                let condDayPts = [];
                if (CONDS.length && currentDate) {
                    const { start: condDayStart, end: condDayEnd } = localDayBounds(currentDate);
                    condDayPts = CONDS
                        .filter(c => c.t >= condDayStart && c.t < condDayEnd)
                        .map(c => ({ ...c, hour: localHour(c.t) }))
                        .filter(c => c.hour <= 23);
                }
                // tide curve for the selected day as fractional hours: the
                // hourly predictions where the station has them, else
                // 10-minute steps along the curve between events. Highs and
                // lows that fall in the day get labeled markers.
                let tideDayPts = [], tideDayEvents = [];
                if (tideExtent && currentDate) {
                    const { start: tideDayStart, end: tideDayEnd } = localDayBounds(currentDate);
                    const step = tideHourly.length > 1 ? 3600e3 : 600e3;
                    for (let t = tideDayStart.getTime(); t < tideDayEnd.getTime(); t += step) {
                        const hour = localHour(new Date(t));
                        // the repeated hour of a DST fall-back day would
                        // run the line backwards
                        if (hour > 23 || (tideDayPts.length && hour <= tideDayPts[tideDayPts.length - 1].hour)) continue;
                        const tide = tideAtTime(t);
                        if (tide) tideDayPts.push({ hour, ft: tide.ft });
                    }
                    tideDayEvents = tideEvents
                        .filter(e => e.t >= tideDayStart.getTime() && e.t < tideDayEnd.getTime())
                        .map(e => ({ ...e, hour: localHour(new Date(e.t)) }))
                        .filter(e => e.hour <= 23);
                    if (tideDayPts.length < 2) tideDayPts = [];
                }
                // the panel stays on a day past the predictions so the
                // chart keeps its shape, with a note instead of a curve
                const showTide = !!tideExtent;
                const tideTop = windBottom + panelGap;
                const tideBottom = showTide ? tideTop + tideLaneH : windBottom;

                const condTop = tideBottom + panelGap;
                const chartBottom = condDayPts.length ? condTop + condLaneH : tideBottom;
                d3.select(svg.node().ownerSVGElement)
                    .attr("width", width + margin.left + margin.right)
                    .attr("height", chartBottom + margin.top + margin.bottom)
                    .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${chartBottom + margin.top + margin.bottom}`)
                    .style("height", (chartBottom + margin.top + margin.bottom) + "px");
                xAxisGroup.attr("transform", `translate(0,${chartBottom})`);

                const surfDayPts = SURF_MODE ? condDayPts : [];
                const maxWaveHeight = Math.max(
                    d3.max(data, d => Math.max(d.PrimaryWaveHeight, d.SecondaryWaveHeight, d.TertiaryWaveHeight, d.QuaternaryWaveHeight, d.WindSeaHeight || 0)) * 3.28084,
                    d3.max(surfDayPts, c => c.ft_hi) || 0);
                y.domain([0, maxWaveHeight]);
                yScale.domain([0, maxWaveHeight]);
                // dedupe ticks that would render identical labels
                yAxis.tickValues([...new Set(yScale.ticks(3).map(v => +v.toFixed(1)))]);
                // Drawn without a transition: updateChart runs again when the
                // wind fetch lands, and the second call used to interrupt the
                // first one's exit transition, leaving stale tick labels from
                // the previous domain on the axis alongside the new ones.
                svg.select(".yaxis").call(yAxis);
                setAxisColor();

                // Panel frames, 3-hour gridlines, and title rows. Inserted
                // first so every series draws on top of them.
                svg.selectAll(".panel-chrome").remove();
                const chrome = svg.insert("g", ":first-child").attr("class", "panel-chrome");
                const panels = [[0, height]];
                if (showWind) panels.push([windTop, windBottom]);
                if (showTide) panels.push([tideTop, tideBottom]);
                if (condDayPts.length) panels.push([condTop, chartBottom]);
                for (const [top, bottom] of panels) {
                    chrome.append("rect").attr("class", "plot-bg")
                        .attr("x", 0).attr("y", top)
                        .attr("width", width).attr("height", bottom - top)
                        .attr("fill", themeColor('--panel', '#17181b'))
                        .attr("stroke", CHART.gridStrong);
                    for (let h = 3; h < 23; h += 3) {
                        chrome.append("line").attr("class", "hour-grid")
                            .attr("x1", x(h)).attr("x2", x(h))
                            .attr("y1", top).attr("y2", bottom)
                            .attr("stroke", CHART.grid);
                    }
                }
                // title on the left, the panel's one-line summary on the right
                const panelTitle = (y, title, summary, summaryColor) => {
                    chrome.append("text").attr("class", "panel-title")
                        .attr("x", 0).attr("y", y - 9)
                        .attr("fill", CHART.title)
                        .text(title);
                    if (summary) {
                        chrome.append("text").attr("class", "panel-summary")
                            .attr("x", width).attr("y", y - 9)
                            .attr("text-anchor", 'end')
                            .attr("fill", summaryColor || CHART.title)
                            .text(summary);
                    }
                };
                let swellSummary = '';
                if (surfDayPts.length) {
                    const pk = surfDayPts.reduce((a, b) => (b.ft_hi > a.ft_hi ? b : a));
                    swellSummary = `Peak surf ${pk.surf} at ${fmtHour(pk.hour)}`;
                } else {
                    const pk = data.reduce((a, b) => (+b.PrimaryWaveHeight > +a.PrimaryWaveHeight ? b : a));
                    swellSummary = `Peak primary ${(pk.PrimaryWaveHeight * 3.28084).toFixed(1)} ft @ ${pk.PrimaryPeriod}s ${cardinal(pk.PrimaryDegrees)} at ${fmtHour(pk.hour)}`;
                }
                panelTitle(0, surfDayPts.length ? 'SURF & SWELL HEIGHT (FT)' : 'SWELL HEIGHT (FT)', swellSummary);

                const linePrimary = d3.line().x(d => x(d.hour)).y(d => y(d.PrimaryWaveHeight * 3.28084)).curve(d3.curveMonotoneX);
                const lineSecondary = d3.line().x(d => x(d.hour)).y(d => y(d.SecondaryWaveHeight * 3.28084)).curve(d3.curveMonotoneX);
                const lineTertiary = d3.line().x(d => x(d.hour)).y(d => y(d.TertiaryWaveHeight * 3.28084)).curve(d3.curveMonotoneX);
                const lineQuaternary = d3.line().x(d => x(d.hour)).y(d => y(d.QuaternaryWaveHeight * 3.28084)).curve(d3.curveMonotoneX);

                // breaking surf range behind the swell lines it comes from
                svg.selectAll(".surfBand").data(surfDayPts.length > 1 ? [surfDayPts] : []).join("path").attr("class", "surfBand")
                    .attr("d", d3.area().x(c => x(c.hour)).y0(c => y(c.ft_lo)).y1(c => y(c.ft_hi)).curve(d3.curveMonotoneX))
                    .attr("fill", chartColors.surf).attr("fill-opacity", 0.16)
                    .attr("stroke", chartColors.surf).attr("stroke-opacity", 0.45).attr("stroke-width", 0.75);
                const windSeaRows = data.filter(d => parseFloat(d.WindSeaHeight) > 0);
                const lineWindSea = d3.line().defined(d => parseFloat(d.WindSeaHeight) > 0).x(d => x(d.hour)).y(d => y(d.WindSeaHeight * 3.28084)).curve(d3.curveMonotoneX);
                svg.selectAll(".lineWindSea").data(windSeaRows.length ? [data] : []).join("path").attr("class", "lineWindSea").attr("d", lineWindSea).attr("fill", "none").attr("stroke-width", 1.25).attr("stroke-dasharray", "4,3").attr("stroke", chartColors.lineWindSea);

                svg.selectAll(".linePrimary").data([data]).join("path").attr("class", "linePrimary").attr("d", linePrimary).attr("fill", "none").attr("stroke-width", 1.5).attr("stroke", chartColors.linePrimary);
                svg.selectAll(".lineSecondary").data([data]).join("path").attr("class", "lineSecondary").attr("d", lineSecondary).attr("fill", "none").attr("stroke-width", 1.25).attr("stroke", chartColors.lineSecondary);
                svg.selectAll(".lineTertiary").data([data]).join("path").attr("class", "lineTertiary").attr("d", lineTertiary).attr("fill", "none").attr("stroke-width", 1).attr("stroke", chartColors.lineTertiary);
                svg.selectAll(".lineQuaternary").data([data]).join("path").attr("class", "lineQuaternary").attr("d", lineQuaternary).attr("fill", "none").attr("stroke-width", 1).attr("stroke", chartColors.lineQuaternary);


                // direction arrows on each swell line, thinned on narrow
                // screens so neighbors never overlap
                const arrowEvery = Math.max(1, Math.ceil(24 / Math.max(x(1) - x(0), 1)));
                const halo = themeColor('--panel', '#17181b');
                const swellArrows = (cls, rows, field, degField, color, size) => {
                    svg.selectAll(`.${cls}`)
                        .data(rows.filter((d, i) => i % arrowEvery === 0 && parseFloat(d[field]) > 0))
                        .join("path").attr("class", cls)
                        .attr("transform", d => `translate(${x(d.hour)},${y(d[field] * 3.28084)}) rotate(${travelBearing(d[degField])})`)
                        .attr("d", arrowPath(size))
                        .attr("fill", color)
                        .attr("stroke", halo).attr("stroke-width", 1).attr("stroke-linejoin", 'round');
                };
                swellArrows('windSeaPoint', data, 'WindSeaHeight', 'WindSeaDegrees', chartColors.lineWindSea, 6.5);
                swellArrows('quaternaryPoint', data, 'QuaternaryWaveHeight', 'QuaternaryDegrees', chartColors.lineQuaternary, 7);
                swellArrows('tertiaryPoint', data, 'TertiaryWaveHeight', 'TertiaryDegrees', chartColors.lineTertiary, 7);
                swellArrows('secondaryPoint', data, 'SecondaryWaveHeight', 'SecondaryDegrees', chartColors.lineSecondary, 7.5);
                swellArrows('primaryPoint', data, 'PrimaryWaveHeight', 'PrimaryDegrees', chartColors.linePrimary, 8);

                if (showWind) {
                    const lane = svg.append("g").attr("class", "wind-lane");
                    const wdTop = windTop, wdBase = windBottom, wdMid = (wdTop + wdBase) / 2;
                    // a row of speed readings across the top of the panel;
                    // the line plots beneath it
                    const readingY = wdTop + 13, plotTop = wdTop + 24;
                    let windSummary = '';
                    if (windState === 'loading') {
                        lane.append("line").attr("class", "wind-loading")
                            .attr("x1", 0).attr("x2", width)
                            .attr("y1", wdMid).attr("y2", wdMid)
                            .attr("stroke", CHART.wind).attr("stroke-width", 1.5)
                            .attr("stroke-dasharray", '4,5');
                        lane.append("text").attr("class", "wind-loading")
                            .attr("x", width / 2).attr("y", wdMid - 8)
                            .attr("text-anchor", 'middle')
                            .attr("fill", CHART.wind)
                            .text('loading wind…');
                    } else if (!windDayPts.length) {
                        lane.append("text")
                            .attr("x", width / 2).attr("y", wdMid + 3)
                            .attr("text-anchor", 'middle')
                            .attr("fill", CHART.label)
                            .text('no wind data for this day');
                    } else {
                        const mph = w => w.s * 2.237;
                        const maxMph = d3.max(windDayPts, mph);
                        const yw = d3.scaleLinear().domain([0, Math.max(maxMph * 1.1, 10)]).nice(4).range([wdBase, plotTop]);
                        // mph axis with gridlines, like the swell panel
                        for (const t of yw.ticks(3)) {
                            if (t > 0) {
                                lane.append("line")
                                    .attr("x1", 0).attr("x2", width)
                                    .attr("y1", yw(t)).attr("y2", yw(t))
                                    .attr("stroke", CHART.grid);
                            }
                            lane.append("text").attr("class", "axis-label")
                                .attr("x", -8).attr("y", yw(t)).attr("dy", '0.32em')
                                .attr("text-anchor", 'end')
                                .attr("fill", CHART.axis)
                                .text(t);
                        }
                        lane.append("path").datum(windDayPts)
                            .attr("fill", 'none').attr("stroke", CHART.wind).attr("stroke-width", 1.75)
                            .attr("d", d3.line().x(w => x(w.hour)).y(w => yw(mph(w))).curve(d3.curveMonotoneX));
                        // each model sample gets a direction arrow on the line
                        // and its speed in the reading row; the interpolated
                        // day-edge points only extend the line
                        const windPeak = windDayPts.reduce((a, b) => (b.s > a.s ? b : a));
                        const samples = windDayPts.filter(p => !p.pad);
                        // thin arrows and readings so they never crowd on
                        // narrow screens; the peak reading is always shown
                        const stride = minPx => {
                            const gap = samples.length > 1 ? x(samples[1].hour) - x(samples[0].hour) : width;
                            return Math.max(1, Math.ceil(minPx / Math.max(gap, 1)));
                        };
                        const windArrowEvery = stride(24), readingEvery = stride(30);
                        samples.forEach((w, i) => {
                            if (i % windArrowEvery && w !== windPeak) return;
                            lane.append("path")
                                .attr("d", arrowPath(8))
                                .attr("transform", `translate(${x(w.hour)}, ${yw(mph(w))}) rotate(${travelBearing(w.d)})`)
                                .attr("fill", CHART.wind)
                                .attr("stroke", themeColor('--panel', '#17181b')).attr("stroke-width", 1).attr("stroke-linejoin", 'round');
                            if (w !== windPeak && (i % readingEvery || Math.abs(x(w.hour) - x(windPeak.hour)) < 30)) return;
                            lane.append("text").attr("class", "wind-reading")
                                .attr("x", Math.max(8, Math.min(width - 8, x(w.hour))))
                                .attr("y", readingY)
                                .attr("text-anchor", 'middle')
                                .attr("fill", CHART.wind)
                                .attr("font-weight", w === windPeak ? 700 : 400)
                                .text(mph(w).toFixed(0));
                        });
                        windSummary = `Peak ${mph(windPeak).toFixed(0)} mph ${cardinal(windPeak.d)} at ${fmtHour(windPeak.hour)}`;
                    }
                    panelTitle(wdTop, 'WIND (MPH)', windSummary, CHART.wind);
                }

                // tide panel: the day's curve on a fixed range, highs
                // labeled above their marker and lows below
                if (showTide) {
                    const lane = svg.append("g").attr("class", "tide-lane");
                    const tdTop = tideTop, tdBase = tideBottom;
                    // room inside the frame for the event labels
                    // the data's own range (not niced: rounding out to the
                    // next 5 ft flattens a 6 ft tide)
                    const yt = d3.scaleLinear()
                        .domain(tideExtent)
                        .range([tdBase - 18, tdTop + 20]);
                    const ftLabel = v => `${v.toFixed(1)} ft`;
                    const station = TIDE.name && TIDE.name.length > 30 ? `${TIDE.name.slice(0, 29)}…` : (TIDE.name || TIDE.station);
                    panelTitle(tdTop, 'TIDE (FT, MLLW)', `${station} · ${TIDE.km.toFixed(0)} km`, CHART.axis);
                    for (const t of yt.ticks(4)) {
                        lane.append("line")
                            .attr("x1", 0).attr("x2", width)
                            .attr("y1", yt(t)).attr("y2", yt(t))
                            .attr("stroke", t === 0 ? CHART.gridStrong : CHART.grid)
                            .attr("stroke-dasharray", t === 0 ? '3,3' : null);
                        lane.append("text").attr("class", "axis-label")
                            .attr("x", -8).attr("y", yt(t)).attr("dy", '0.32em')
                            .attr("text-anchor", 'end')
                            .attr("fill", CHART.axis)
                            .text(t);
                    }
                    if (!tideDayPts.length) {
                        lane.append("text")
                            .attr("x", width / 2).attr("y", (tdTop + tdBase) / 2 + 3)
                            .attr("text-anchor", 'middle')
                            .attr("fill", CHART.label)
                            .text('no tide predictions for this day');
                    } else {
                        lane.append("path").datum(tideDayPts)
                            .attr("fill", CHART.tide).attr("fill-opacity", 0.12)
                            .attr("d", d3.area().x(p => x(p.hour)).y0(tdBase).y1(p => yt(p.ft)).curve(d3.curveMonotoneX));
                        lane.append("path").datum(tideDayPts)
                            .attr("fill", 'none').attr("stroke", CHART.tide).attr("stroke-width", 1.75)
                            .attr("d", d3.line().x(p => x(p.hour)).y(p => yt(p.ft)).curve(d3.curveMonotoneX));
                        for (const e of tideDayEvents) {
                            const ex = x(e.hour), ey = yt(e.ft);
                            lane.append("circle")
                                .attr("cx", ex).attr("cy", ey).attr("r", 2.5)
                                .attr("fill", CHART.tide)
                                .attr("stroke", themeColor('--panel', '#17181b')).attr("stroke-width", 1);
                            const when = new Date(e.t);
                            const hh = when.getHours(), mm = String(when.getMinutes()).padStart(2, '0');
                            lane.append("text").attr("class", "tide-reading")
                                // half a label's width from either edge
                                .attr("x", Math.max(46, Math.min(width - 46, ex)))
                                .attr("y", e.high ? ey - 7 : ey + 14)
                                .attr("text-anchor", 'middle')
                                .attr("fill", CHART.tide)
                                .attr("font-weight", e.high ? 600 : 400)
                                .text(`${ftLabel(e.ft)} ${hh % 12 || 12}:${mm}${hh < 12 ? 'am' : 'pm'}`);
                        }
                    }
                }

                // surf-condition panel: hourly score bars on the 0-100
                // scale, with the rating bands marked on the axis
                if (condDayPts.length) {
                    const lane = svg.append("g").attr("class", "cond-lane");
                    const cdTop = condTop, cdBase = chartBottom;
                    const dayBest = condDayPts.reduce((a, b) => (b.score > a.score ? b : a));
                    panelTitle(cdTop, 'SURF CONDITIONS (SCORE)',
                        `Best ${fmtHour(dayBest.hour)} · ${dayBest.rating.toUpperCase()}`,
                        CONDITION_COLORS[dayBest.rating]);
                    const yc = d3.scaleLinear().domain([0, 100]).range([cdBase, cdTop]);
                    for (const [rating, lo, hi] of COND_BANDS) {
                        if (lo > 0) {
                            lane.append("line")
                                .attr("x1", 0).attr("x2", width)
                                .attr("y1", yc(lo)).attr("y2", yc(lo))
                                .attr("stroke", CHART.gridStrong)
                                .attr("stroke-dasharray", '3,3');
                        }
                        lane.append("text").attr("class", "axis-label")
                            .attr("x", -8).attr("y", yc((lo + hi) / 2)).attr("dy", '0.32em')
                            .attr("text-anchor", 'end')
                            .attr("fill", CONDITION_COLORS[rating])
                            .attr("font-weight", 600)
                            .text(rating.toUpperCase());
                    }
                    // bars center on their hour like the panels above; the
                    // first and last are cropped at the plot edge (a half
                    // bar) rather than shifted into their neighbor
                    const bw = Math.max(2, x(1) - x(0) - 3);
                    const barX = c => Math.max(0, x(c.hour) - bw / 2);
                    const barW = c => Math.min(width, x(c.hour) + bw / 2) - barX(c);
                    lane.selectAll(".cond-bar").data(condDayPts).join("rect")
                        .attr("class", "cond-bar")
                        .attr("x", barX)
                        .attr("width", barW)
                        .attr("y", c => yc(Math.max(c.score, 5)))
                        .attr("height", c => cdBase - yc(Math.max(c.score, 5)))
                        .attr("rx", 1.5)
                        .attr("fill", c => CONDITION_COLORS[c.rating]);
                }

                const tooltip = d3.select("#tooltip");
                const verticalLine = svg.append("line").attr("class", "vertical-line").attr("y1", 0).attr("y2", chartBottom).attr("stroke", chartColors.verticalLine).attr("stroke-width", 1).attr("stroke-dasharray", "5,5").style("opacity", 0);
                svg.append("rect").attr("class", "overlay").attr("width", width).attr("height", chartBottom).style("fill", "none").style("pointer-events", "all");

                svg.on("mousemove", (event) => {
                    const mousePos = d3.pointer(event);
                    const mouseX = Math.max(0, Math.min(width, mousePos[0]));
                    verticalLine.attr("x1", mouseX).attr("x2", mouseX).style("opacity", 1);
                    const hoverDate = x.invert(mouseX);
                    const closestData = data.reduce((prev, curr) => (Math.abs(curr.hour - hoverDate) < Math.abs(prev.hour - hoverDate) ? curr : prev));
                    const nearest = pts => pts.reduce((prev, curr) => (Math.abs(curr.hour - hoverDate) < Math.abs(prev.hour - hoverDate) ? curr : prev));
                    const c = condDayPts.length ? nearest(condDayPts) : null;
                    const w = windDayPts.length ? nearest(windDayPts) : null;
                    tooltip.style("visibility", "visible").html(readoutHTML({
                        when: `${currentDayName()} ${fmtHour(closestData.hour)}`,
                        surf: SURF_MODE && c ? c.surf : null,
                        rating: c ? c.rating : null,
                        swell: mainSwell(closestData),
                        wind: w ? { mph: (w.s * 2.237).toFixed(0), deg: w.d } : null,
                        tide: tideDayPts.length ? tideAtTime(closestData.dateObj.getTime()) : null,
                    }));
                    // flip to the cursor's left when the tooltip would be
                    // squeezed against the right edge (measure after setting
                    // content so the width is the natural, unwrapped one)
                    const ttW = tooltip.node().offsetWidth;
                    const flipX = event.pageX + 15 + ttW > document.documentElement.clientWidth - 8;
                    tooltip.style("left", (flipX ? event.pageX - ttW - 15 : event.pageX + 15) + "px")
                        .style("top", (event.pageY + 15) + "px");
                });

                svg.on("mouseleave", () => {
                    tooltip.style("visibility", "hidden");
                    verticalLine.style("opacity", 0);
                });
            }

            cards.forEach(card => {
                card.addEventListener('click', function() {
                    cards.forEach(c => c.classList.remove('selectedforecast'));
                    this.classList.add('selectedforecast');
                    const date = this.getAttribute('data-date');
                    displayClicked(date);
                    updateChart(currentDay, svg);
                });
            });

            if (firstCard) {
                firstCard.classList.add('selectedforecast');
                const date = firstCard.getAttribute('data-date');
                displayClicked(date);
                updateChart(currentDay, svg);
            }

            const observer = new MutationObserver(() => {
                updateChart(currentDay, svg);
            });
            observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
        });
    </script>

    <style>
        .swell-strip { position: relative; margin-top: 12px; background: var(--raised); border: 1px solid var(--line); }
        .swell-strip .strip-title, .swell-strip #stripReadout { font-family: var(--font-mono); }
        .swell-strip svg { display: block; }
        .strip-hover-line { position: absolute; z-index: 3; top: 0; bottom: 0; display: none; width: 1px; background: var(--accent-soft); box-shadow: 0 0 7px rgba(72, 170, 168, .45); pointer-events: none; }
        /* Hover tooltips are the fastest way to read an exact value off any
           chart here, so they are sized for reading, not for minimalism:
           10px values, a full-contrast header, and a solid backdrop. */
        .strip-panel-tooltip {
            position: absolute; z-index: 5; display: none; min-width: 168px;
            padding: 9px 10px; border: 1px solid #365d7c; border-left: 2px solid var(--swell);
            background: rgba(20, 21, 26, .98);
            box-shadow: var(--shadow-pop);
            color: var(--text); font-family: var(--font-mono);
            font-size: 10px; line-height: 1.45; pointer-events: none;
        }
        /* One equal-width column per forecast day; the row scrolls on
           narrow screens. The selected day is also shown as a band in the
           strip above, so the strip stays readable while this scrolls. */
        #forecastContainer {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(52px, 1fr);
            gap: 2px;
            margin-top: 2px;
            overflow-x: auto;
        }
        .forecastcard {
            min-width: 0;
            padding: 7px 2px;
            background: var(--raised);
            border: 1px solid var(--line);
            cursor: pointer;
            text-align: center;
            transition: border-color 120ms ease, background 120ms ease;
        }
        .forecastcard:hover { background: var(--hover); border-color: var(--line-strong); }
        /* The selected day is the chart's subject; mark it with the accent on
           all four sides plus a top rule so it reads at a glance in a row of
           sixteen otherwise identical cards. */
        .forecastcard.selectedforecast {
            background: #14283a;
            border-color: var(--accent);
            box-shadow: inset 0 2px 0 var(--accent-bright);
        }
        .forecastcard .fc-day {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-2);
            white-space: nowrap;
        }
        .forecastcard.selectedforecast .fc-day { color: var(--accent-soft); }
        .forecastcard .fc-height { font-size: 12px; font-weight: 600; margin-top: 3px; white-space: nowrap; }
        .forecastcard .fc-cond {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-top: 2px;
        }
        .swell-detail {
            margin-top: 12px;
            padding: 10px 10px 6px;
            background: var(--raised);
            border: 1px solid var(--line);
        }
        /* the selected day: the detail card's one loud element */
        #date-header { font-size: 15px; font-weight: 600; color: #fff; }
        #date-header .hdr-date { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--text-2); margin-left: 4px; }
        #chart-container { width: 100%; min-width: 0; }
        #chart, #chart svg { display: block; width: 100%; }
        /* The svg can be CSS-stretched from its drawn size; keep hairlines
           1px and pixel-snapped so gridlines don't blur or drift. */
        #chart .xaxis line, #chart .xaxis .domain, #chart .yaxis line {
            shape-rendering: crispEdges;
            vector-effect: non-scaling-stroke;
        }
        #chart text { font-family: var(--font-mono); font-size: 10px; }
        #chart .panel-title { font-size: 10px; font-weight: 600; letter-spacing: .04em; }
        #chart .panel-summary { font-size: 10px; font-weight: 600; }
        #chart .plot-bg, #chart .hour-grid { shape-rendering: crispEdges; }
        /* pulse for the wind lane's loading placeholder */
        .wind-loading { animation: windPulse 1.4s ease-in-out infinite; }
        @keyframes windPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.85; } }
        #tooltip {
            z-index: 20;
            min-width: 168px;
            padding: 9px 10px;
            background: rgba(20, 21, 26, .98);
            border: 1px solid #365d7c;
            border-left: 2px solid var(--swell);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 10px;
            line-height: 1.45;
            box-shadow: var(--shadow-pop);
        }
        /* hover readout: time, then the headline (surf + rating), then a
           small key/value subheader */
        .readout-time { color: var(--text-3); font-size: 10px; letter-spacing: .03em; }
        .readout-head { display: flex; align-items: center; gap: 8px; margin-top: 3px; white-space: nowrap; }
        .readout-surf { color: #fff; font-family: var(--font-sans); font-size: 18px; font-weight: 600; line-height: 1.15; }
        .readout-rating {
            padding: 2px 6px 1px; border-radius: 2px;
            background: var(--rating-color); color: var(--bg);
            font-size: 10px; font-weight: 700; letter-spacing: .04em;
        }
        .readout-sub {
            display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
            margin-top: 7px; padding-top: 6px; border-top: 1px solid #3b3e49;
            font-size: 10px; white-space: nowrap;
        }
        .readout-sub .k { color: var(--text-3); }
        .readout-sub .v { color: var(--text-1); }
        /* phones: the day-card row scrolls anyway, so give each card
           room to be readable under a thumb */
        @media (max-width: 767px) {
            #forecastContainer { grid-auto-columns: minmax(68px, 1fr); }
            .forecastcard { padding: 9px 4px; }
            .forecastcard .fc-day { font-size: 10px; }
            .forecastcard .fc-height { font-size: 13px; margin-top: 4px; }
            .forecastcard .fc-cond { font-size: 9px; margin-top: 3px; }
        }
        @media (max-width: 520px) {
            .swell-detail { padding-inline: 6px; }
        }
    </style>

    <!-- 16-day outlook: swell + wind lanes. The selected day is shown as a
         band in the strip; the day cards beneath are an independent,
         horizontally scrollable row built from the same local-day grouping. -->
    <div class="swell-strip">
        <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-0.5 px-3 pt-2">
            <span class="strip-title text-[10px] font-semibold uppercase tracking-wide text-[#a6aab2]">Swell &amp; wind &middot; 16 day outlook &middot; <span id="forecastTimezone"></span></span>
            <span id="stripReadout" class="text-[10px] text-[#8b9099]">Select a day for hourly detail</span>
        </div>
        <div id="swellStrip"></div>
        <div id="stripHoverLine" class="strip-hover-line" aria-hidden="true"></div>
        <div id="stripTooltip" class="strip-panel-tooltip" role="tooltip"></div>
    </div>
    <div id="forecastContainer"></div>
    <div class="swell-detail">
        <!-- the selected day -->
        <div class="px-1 mb-1">
            <div id="date-header"></div>
        </div>
        <!-- Hourly swell on top, then surface wind (wave-model grid), tide
             (spot pages near a NOAA station) and surf conditions, drawn in
             one svg so the lanes share an x axis and crosshair -->
        <div id="chart-container">
            <div id="chart"></div>
        </div>
    </div>
    <div id="tooltip" class="absolute invisible pointer-events-none"></div>
    <div class="h-8"></div>

</div>
